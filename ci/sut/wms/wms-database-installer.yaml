---
apiVersion: batch/v1
kind: Job
metadata:
  name: wms-database-installer-postgres
  namespace: fat
spec:
  template:
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: pasx-registry-secret
      restartPolicy: Never
      containers:
        - name: databaseinstaller-container
          image: pasxregistry.jfrog.io/pvd/com.werum.pasx.wms.liquibaseexecution:main-latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/postgres
            - name: SPRING_DATASOURCE_USERNAME
              value: pasx
            - name: SPRING_DATASOURCE_PASSWORD
              value: pasx
          resources:
            limits:
              memory: "3000M"
              cpu: "1000m"

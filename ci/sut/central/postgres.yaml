apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: fat
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: runtime-environment
data:
  user: cGFzeA==
  password: cGFzeA==
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: fat
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: runtime-environment
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      imagePullSecrets:
        - name: pasx-registry-secret
      containers:
        - name: postgres
          image: pasxregistry.jfrog.io/pvd/com.werum.pasx.docker.postgres:15.3-single-schema-dev-content-20230621-1825
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              value: pasx
            - name: TZ
              value: "Europe/Berlin"
            - name: PGTZ
              value: "Europe/Berlin"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fat
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: runtime-environment
spec:
  selector:
    app.kubernetes.io/name: postgres
  type: ClusterIP
  ports:
    - name: jdbc
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fat
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: runtime-environment
spec:
  selector:
    app.kubernetes.io/name: postgres
  type: NodePort
  ports:
    - name: jdbc
      port: 5432
      targetPort: 5432
      nodePort: 30001
